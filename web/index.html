<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>이거 먹어도 돼요?</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app" aria-live="polite">
    <header class="brand hidden" id="shell">
      <h1 id="title">이거 먹어도 돼요?</h1>
      <p id="subtitle">당뇨 음식 찾기</p>
    </header>
    <div class="search hidden" id="searchBox">
      <span class="ic" aria-hidden="true">🔍</span>
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="음식 이름을 쳐보세요" aria-label="음식 검색">
      <button class="clear hidden" id="clear" aria-label="지우기">✕</button>
    </div>
    <main id="screen">
      <p class="loading">불러오는 중…</p>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
