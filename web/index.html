<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>이거 먹어도 돼요?</title>
<!-- 링크 미리보기 카드 (카톡·문자 등). 스크래퍼는 자바스크립트를 안 돌리고
     이 태그만 읽으므로 모든 음식이 같은 카드로 뜬다 — 어느 음식인지는
     공유 문구(share.js)가 전한다. 이미지는 절대 주소여야 한다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="이거 먹어도 돼요?">
<meta property="og:description" content="당뇨 음식 신호등 — 이름만 치면 좋음·주의·피하기로 알려드려요">
<meta property="og:url" content="https://comdesk.github.io/gi-checker/">
<meta property="og:image" content="https://comdesk.github.io/gi-checker/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="먹어도 돼요?">
</head>
<body>
  <div id="app" aria-live="polite">
    <header class="brand hidden" id="shell">
      <h1 id="title">이거 먹어도 돼요?</h1>
      <p id="subtitle">당뇨 음식 찾기</p>
    </header>
    <div class="search hidden" id="searchBox">
      <span class="ic" aria-hidden="true">🔍</span>
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="음식 이름을 쳐보세요" aria-label="음식 검색">
      <button class="clear hidden" id="clear" aria-label="지우기">✕</button>
    </div>
    <main id="screen">
      <p class="loading">불러오는 중…</p>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
